# HANYA dev/sandbox. Pakai: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
# - publikasikan Postgres ke localhost:5432 (untuk go test / go run lokal)
# - build secret extra_ca: CA bundle proxy TLS-intercepting (EXTRA_CA_FILE=./ca.pem)
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  app:
    image: natter:dev
    build:
      context: .
      secrets:
        - extra_ca
  backup:
    image: natter:dev
    build:
      context: .
      secrets:
        - extra_ca

  # Jangan jalankan Watchtower di dev (akan mengganti image build lokal dan memasang docker.sock).
  watchtower:
    profiles: ["prod-only"]

secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}
